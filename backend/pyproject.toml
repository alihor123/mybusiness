[project]
name = "mybusiness-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "authx>=1.4,<2",
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.9,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
