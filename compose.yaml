services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mybusiness}
      POSTGRES_USER: ${POSTGRES_USER:-mybusiness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate:
    build: ./backend
    env_file: backend/.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: ./backend
    env_file: backend/.env
    environment:
      PRIVATE_UPLOAD_DIR: /srv/backend/var/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - private_uploads:/srv/backend/var/uploads
  nginx:
    image: nginx:1.28-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-./deploy/tls}:/etc/nginx/tls:ro
      - ${REACT_DIST:-./dist}:/usr/share/nginx/html:ro
volumes:
  postgres_data:
  private_uploads:
